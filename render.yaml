services:
  - type: web
    name: shan-d-music-site
    runtime: static
    buildCommand: echo "Preparing Shan-D website"
    staticPublishPath: .
    branch: main
    autoDeploy: true
    routes:
      - type: redirect
        source: /admin
        destination: /admin/
        status: 301
    headers:
      - path: /content/*
        name: Cache-Control
        value: no-cache
